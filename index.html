<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#070b18">
<title>阿飞官网</title>
<link rel="preconnect" href="https://cdnjs.cloudflare.com">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
    /* ===== 设计变量 ===== */
    :root{
        --bg:#070b18;
        --ink:#eef3ff;
        --muted:#93a1c4;
        --stroke:rgba(255,255,255,.10);
        --stroke-2:rgba(255,255,255,.16);
        --glass:rgba(255,255,255,.045);
        --glass-2:rgba(255,255,255,.07);
        --brand:#4361ee;
        --brand-2:#3a0ca3;
        --accent:#4895ef;

        /* 版式节奏：统一间距刻度 */
        --maxw:780px;
        --gap:clamp(12px,1.8vw,16px);
        --pad:clamp(18px,2.8vw,26px);
        --sec-gap:clamp(20px,3vw,28px);
        --radius:18px;
        --radius-sm:12px;
        --ease:cubic-bezier(.16,1,.3,1);
    }

    *{margin:0;padding:0;box-sizing:border-box}
    html{-webkit-text-size-adjust:100%}

    body{
        position:relative;
        min-height:100vh;
        min-height:100dvh;
        display:flex;
        flex-direction:column;
        padding:clamp(20px,4.4vw,60px) clamp(16px,3.4vw,32px);
        color:var(--ink);
        background:var(--bg);
        font-family:'Inter','PingFang SC','Noto Sans SC','Microsoft YaHei',system-ui,-apple-system,sans-serif;
        line-height:1.6;
        text-rendering:optimizeLegibility;
        -webkit-font-smoothing:antialiased;
        -webkit-tap-highlight-color:transparent;
        overflow-x:hidden;
    }

    /* ===== 背景光晕 ===== */
    .bg{
        position:fixed;
        inset:0;
        z-index:-2;
        overflow:hidden;
        pointer-events:none;
    }
    .bg::after{
        content:"";
        position:absolute;
        inset:0;
        background:
            radial-gradient(1200px 600px at 50% -10%,rgba(67,97,238,.22),transparent 70%),
            radial-gradient(900px 500px at 100% 100%,rgba(58,12,163,.25),transparent 70%);
    }
    .orb{
        position:absolute;
        border-radius:50%;
        filter:blur(70px);
        opacity:.55;
        animation:float 18s var(--ease) infinite alternate;
    }
    .orb.a{width:44vmax;height:44vmax;top:-16vmax;left:-12vmax;background:radial-gradient(circle,#4361ee,transparent 65%)}
    .orb.b{width:38vmax;height:38vmax;bottom:-14vmax;right:-10vmax;background:radial-gradient(circle,#7209b7,transparent 65%);animation-delay:-6s}
    .orb.c{width:30vmax;height:30vmax;top:40%;left:55%;background:radial-gradient(circle,#12b7f5,transparent 65%);opacity:.35;animation-delay:-11s}

    @keyframes float{
        from{transform:translate3d(0,0,0) scale(1)}
        to{transform:translate3d(4vmax,-3vmax,0) scale(1.12)}
    }

    /* ===== 外层容器：上下留白由 margin:auto 兜底，内容超高时不会被裁切 ===== */
    .container{
        width:100%;
        max-width:var(--maxw);
        margin-block:auto;
        margin-inline:auto;
        animation:rise .9s var(--ease) both;
    }

    @keyframes rise{
        from{opacity:0;transform:translateY(24px)}
        to{opacity:1;transform:translateY(0)}
    }

    /* ===== 头部 ===== */
    .hero{
        text-align:center;
        margin-bottom:var(--sec-gap);
    }

    .chip{
        display:inline-flex;
        align-items:center;
        gap:8px;
        padding:7px 15px;
        margin-bottom:18px;
        font-size:.76rem;
        font-weight:600;
        letter-spacing:.08em;
        color:#cfd9ff;
        background:var(--glass);
        border:1px solid var(--stroke);
        border-radius:999px;
        backdrop-filter:blur(10px);
    }
    .chip .dot{
        width:7px;height:7px;
        flex:0 0 auto;
        border-radius:50%;
        background:#3ddc97;
        box-shadow:0 0 0 0 rgba(61,220,151,.55);
        animation:pulse 2.2s ease-out infinite;
    }
    @keyframes pulse{
        0%{box-shadow:0 0 0 0 rgba(61,220,151,.55)}
        70%{box-shadow:0 0 0 9px rgba(61,220,151,0)}
        100%{box-shadow:0 0 0 0 rgba(61,220,151,0)}
    }

    h1{
        font-size:clamp(2.05rem,6.2vw,3.25rem);
        font-weight:800;
        line-height:1.15;
        letter-spacing:.015em;
        background:linear-gradient(180deg,#ffffff 12%,#a9baff 100%);
        -webkit-background-clip:text;
        background-clip:text;
        color:transparent;
        filter:drop-shadow(0 8px 30px rgba(67,97,238,.35));
    }

    .subtitle{
        margin-top:14px;
        font-size:clamp(.85rem,2.6vw,.93rem);
        line-height:1.7;
        color:var(--muted);
        letter-spacing:.06em;
    }

    /* ===== 公告卡片 ===== */
    .announcement{
        position:relative;
        margin-bottom:var(--sec-gap);
        padding:calc(var(--pad) - 2px) var(--pad) var(--pad) calc(var(--pad) + 6px);
        background:linear-gradient(180deg,var(--glass-2),var(--glass));
        border:1px solid var(--stroke);
        border-radius:var(--radius);
        backdrop-filter:blur(16px);
        box-shadow:0 18px 50px -20px rgba(0,0,0,.75),inset 0 1px 0 rgba(255,255,255,.06);
        overflow:hidden;
    }
    /* 左侧彩条 */
    .announcement::before{
        content:"";
        position:absolute;
        inset:0 auto 0 0;
        width:3px;
        background:linear-gradient(180deg,var(--accent),var(--brand),#7209b7);
    }
    /* 左上柔光 */
    .announcement::after{
        content:"";
        position:absolute;
        top:-60%;left:-10%;
        width:60%;height:220%;
        background:radial-gradient(closest-side,rgba(72,149,239,.16),transparent);
        pointer-events:none;
    }

    .ann-head{
        position:relative;
        display:flex;
        align-items:center;
        gap:10px;
        margin-bottom:14px;
    }
    .ann-head h2{
        display:flex;
        align-items:center;
        gap:10px;
        font-size:1rem;
        font-weight:700;
        letter-spacing:.04em;
        color:#dfe7ff;
    }
    .ann-head .ico{
        display:grid;
        place-items:center;
        width:28px;height:28px;
        flex:0 0 auto;
        border-radius:9px;
        font-size:.8rem;
        color:#fff;
        background:linear-gradient(135deg,var(--accent),var(--brand));
        box-shadow:0 6px 16px -6px rgba(72,149,239,.9);
    }
    /* 右侧标签：把标题行两端撑开，形成明确的栏位关系 */
    .ann-head .tag{
        margin-left:auto;
        padding:3px 10px;
        font-size:.68rem;
        font-weight:600;
        letter-spacing:.1em;
        color:#9db0e8;
        border:1px solid var(--stroke);
        border-radius:999px;
        background:rgba(255,255,255,.03);
        white-space:nowrap;
    }

    /* 首行为整段声明的主句，单列一行、加重 */
    .ann-lead{
        position:relative;
        margin-bottom:12px;
        padding-bottom:12px;
        font-size:.95rem;
        font-weight:600;
        letter-spacing:.04em;
        color:#e6ecff;
        border-bottom:1px dashed rgba(255,255,255,.09);
    }

    /* 条款逐条成行，悬挂缩进，左边缘对齐 */
    .ann-list{
        position:relative;
        list-style:none;
        display:grid;
        gap:9px;
    }
    .ann-list li{
        position:relative;
        padding-left:16px;
        font-size:clamp(.85rem,2.5vw,.9rem);
        line-height:1.85;
        color:#c3cee9;
        text-align:justify;
        text-wrap:pretty;
        word-break:break-word;
    }
    .ann-list li::before{
        content:"";
        position:absolute;
        left:1px;
        top:.78em;
        width:5px;height:5px;
        border-radius:1.5px;
        background:linear-gradient(135deg,var(--accent),var(--brand));
        opacity:.9;
    }

    /* ===== 按钮区 ===== */
    .links{
        display:grid;
        grid-template-columns:repeat(2,minmax(0,1fr));
        gap:var(--gap);
    }

    .btn{
        position:relative;
        display:flex;
        align-items:center;
        gap:13px;
        min-width:0;
        padding:15px 18px;
        border:none;
        border-radius:15px;
        font:inherit;
        font-size:.98rem;
        font-weight:600;
        letter-spacing:.02em;
        color:#fff;
        text-align:left;
        text-decoration:none;
        cursor:pointer;
        overflow:hidden;
        isolation:isolate;
        background:linear-gradient(135deg,var(--c1),var(--c2));
        box-shadow:0 12px 30px -14px var(--glow),inset 0 1px 0 rgba(255,255,255,.18);
        transition:transform .45s var(--ease),box-shadow .45s var(--ease),filter .45s var(--ease);
    }

    /* 划过的高光带 */
    .btn::before{
        content:"";
        position:absolute;
        inset:0;
        z-index:-1;
        background:linear-gradient(115deg,transparent 25%,rgba(255,255,255,.32) 48%,transparent 68%);
        transform:translateX(-130%);
        transition:transform .85s var(--ease);
    }

    /* 点击涟漪 */
    .btn .ripple{
        position:absolute;
        z-index:-1;
        width:10px;height:10px;
        margin:-5px 0 0 -5px;
        border-radius:50%;
        background:rgba(255,255,255,.5);
        transform:scale(0);
        opacity:.7;
        animation:ripple .62s ease-out forwards;
        pointer-events:none;
    }
    @keyframes ripple{
        to{transform:scale(38);opacity:0}
    }

    .btn:hover{
        transform:translateY(-3px);
        box-shadow:0 22px 44px -18px var(--glow),inset 0 1px 0 rgba(255,255,255,.26);
        filter:brightness(1.06);
    }
    .btn:hover::before{transform:translateX(130%)}
    .btn:active{transform:translateY(-1px) scale(.995)}
    .btn:focus-visible{outline:2px solid #fff;outline-offset:3px}

    /* 图标胶囊 */
    .btn .ico{
        flex:0 0 auto;
        display:grid;
        place-items:center;
        width:38px;height:38px;
        border-radius:11px;
        font-size:1rem;
        background:rgba(255,255,255,.18);
        box-shadow:inset 0 1px 0 rgba(255,255,255,.3);
        transition:transform .45s var(--ease),background .45s var(--ease);
    }
    .btn:hover .ico{
        transform:scale(1.06) rotate(-4deg);
        background:rgba(255,255,255,.26);
    }

    .btn .label{
        flex:1 1 auto;
        min-width:0;
        line-height:1.4;
        text-shadow:0 1px 2px rgba(0,0,0,.18);
        overflow-wrap:anywhere;
    }

    .btn .arrow{
        flex:0 0 auto;
        font-size:.8rem;
        opacity:.65;
        transform:translateX(0);
        transition:transform .45s var(--ease),opacity .45s var(--ease);
    }
    .btn:hover .arrow{transform:translateX(4px);opacity:1}

    /* 横跨两列：主入口 */
    .btn.span-2{grid-column:1 / -1}

    /* 主入口：加高、放大，确立视觉第一层级 */
    .btn-primary{
        padding:18px 20px;
        border-radius:16px;
    }
    .btn-primary .ico{width:44px;height:44px;border-radius:13px;font-size:1.1rem}
    .btn-primary .label{font-size:1.06rem;font-weight:700;letter-spacing:.03em}

    /* 配色 */
    .btn-2{--c1:#4361ee;--c2:#3a0ca3;--glow:rgba(67,97,238,.55)}
    .btn-4{--c1:#2aabee;--c2:#00547f;--glow:rgba(42,171,238,.5)}
    .btn-6{--c1:#12b7f5;--c2:#0a6ea8;--glow:rgba(18,183,245,.5)}

    /* ===== 页脚 ===== */
    .footer{
        margin-top:var(--sec-gap);
        padding-top:18px;
        border-top:1px solid var(--stroke);
        text-align:center;
        font-size:.78rem;
        line-height:1.9;
        color:#6f7d9e;
        letter-spacing:.04em;
    }
    .footer .sep{margin:0 8px;opacity:.55}

    /* ===== 响应式 ===== */
    /* 中屏：按钮仍是双列，但收紧内距，保证标签不挤 */
    @media (max-width:600px){
        .links{grid-template-columns:1fr}
        .btn{padding:14px 16px;font-size:.94rem;gap:11px}
        .btn .ico{width:36px;height:36px;font-size:.95rem}
        .btn-primary{padding:16px 16px}
        .btn-primary .ico{width:40px;height:40px}
        .btn-primary .label{font-size:1rem}
        .ann-head .tag{display:none}
    }

    @media (max-width:380px){
        .btn .arrow{display:none}
        .ann-list li{text-align:left}
    }

    @media (prefers-reduced-motion:reduce){
        *,*::before,*::after{
            animation-duration:.001ms!important;
            animation-iteration-count:1!important;
            transition-duration:.001ms!important;
        }
    }
</style>
</head>
<body>
    <!-- 背景光晕 -->
    <div class="bg" aria-hidden="true">
        <span class="orb a"></span>
        <span class="orb b"></span>
        <span class="orb c"></span>
    </div>

    <div class="container">
        <header class="hero">
            <div class="chip"><span class="dot"></span>官方入口 · 实时更新</div>
            <h1>阿飞官网</h1>

        <section class="announcement" aria-labelledby="noticeTitle">
            <div class="ann-head">

                <span class="tag">声明</span>
            </div>

            <p class="ann-lead">☆阿飞全项目公告声明☆</p>

            <ul class="ann-list">
                <li>本系列作品仅供学习研究，使用者的任何行为与应用阿飞无关，请在 24 小时内删除本应用［下载代表同意本协议］</li>
                <li>若有侵权违法行为，请联系我方删除内容</li>
                <li>本卡网均为自愿捐赠</li>
                <li>不支持米八 · 下单默认同意</li>
                <li>有事联系阿飞 · 恶意投诉拉黑删卡处理</li>
            </ul>
        </section>

        <nav class="links" aria-label="快捷入口">
            <a href="https://www.zidianidc.com/shop/FFA" class="btn btn-2 span-2 btn-primary" target="_blank" rel="noopener noreferrer">
                <span class="ico"><i class="fas fa-credit-card"></i></span>
                <span class="label">卡网1</span>
                <i class="fas fa-arrow-right arrow" aria-hidden="true"></i>
            </a>

            <a href="https://t.me/KSAFNB" class="btn btn-4" target="_blank" rel="noopener noreferrer">
                <span class="ico"><i class="fab fa-telegram"></i></span>
                <span class="label">TG 群 @KSAFNB</span>
                <i class="fas fa-arrow-right arrow" aria-hidden="true"></i>
            </a>

            <a href="https://qm.qq.com/q/zyEUiopSko" class="btn btn-6" target="_blank" rel="noopener noreferrer">
                <span class="ico"><i class="fab fa-qq"></i></span>
                <span class="label">QQ 群</span>
                <i class="fas fa-arrow-right arrow" aria-hidden="true"></i>
            </a>
        </nav>

        <footer class="footer">
            <span>阿飞官网</span><span class="sep">·</span><span>仅供学习研究，24 小时内删除</span>
        </footer>
    </div>

    <script>
        (function () {
            var reduceMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;

            // 按钮点击涟漪
            Array.prototype.forEach.call(document.querySelectorAll('.btn'), function (btn) {
                btn.addEventListener('click', function (e) {
                    if (reduceMotion) return;
                    var r = btn.getBoundingClientRect();
                    var x = (e.clientX || r.left + r.width / 2) - r.left;
                    var y = (e.clientY || r.top + r.height / 2) - r.top;
                    var s = document.createElement('span');
                    s.className = 'ripple';
                    s.style.left = x + 'px';
                    s.style.top = y + 'px';
                    btn.appendChild(s);
                    setTimeout(function () { s.remove(); }, 640);
                });
            });
        })();
    </script>
</body>
</html>
