<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#070b18">
<title>阿飞官网</title>
<link rel="preconnect" href="https://cdnjs.cloudflare.com">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
    /* ===== 设计变量 ===== */
    :root{
        --bg:#070b18;
        --ink:#eef3ff;
        --muted:#93a1c4;
        --stroke:rgba(255,255,255,.10);
        --stroke-2:rgba(255,255,255,.16);
        --glass:rgba(255,255,255,.045);
        --glass-2:rgba(255,255,255,.07);
        --brand:#4361ee;
        --brand-2:#3a0ca3;
        --accent:#4895ef;

        /* 版式节奏：统一间距刻度 */
        --maxw:780px;
        --gap:clamp(12px,1.8vw,16px);
        --pad:clamp(18px,2.8vw,26px);
        --sec-gap:clamp(20px,3vw,28px);
        --radius:18px;
        --radius-sm:12px;
        --ease:cubic-bezier(.16,1,.3,1);
    }

    *{margin:0;padding:0;box-sizing:border-box}
    html{-webkit-text-size-adjust:100%}

    body{
        position:relative;
        min-height:100vh;
        min-height:100dvh;
        display:flex;
        flex-direction:column;
        padding:clamp(20px,4.4vw,60px) clamp(16px,3.4vw,32px);
        color:var(--ink);
        background:var(--bg);
        font-family:'Inter','PingFang SC','Noto Sans SC','Microsoft YaHei',system-ui,-apple-system,sans-serif;
        line-height:1.6;
        text-rendering:optimizeLegibility;
        -webkit-font-smoothing:antialiased;
        -webkit-tap-highlight-color:transparent;
        overflow-x:hidden;
    }

    /* ===== 背景光晕 ===== */
    .bg{
        position:fixed;
        inset:0;
        z-index:-2;
        overflow:hidden;
        pointer-events:none;
    }
    .bg::after{
        content:"";
        position:absolute;
        inset:0;
        background:
            radial-gradient(1200px 600px at 50% -10%,rgba(67,97,238,.22),transparent 70%),
            radial-gradient(900px 500px at 100% 100%,rgba(58,12,163,.25),transparent 70%);
    }
    .orb{
        position:absolute;
        border-radius:50%;
        filter:blur(70px);
        opacity:.55;
        animation:float 18s var(--ease) infinite alternate;
    }
    .orb.a{width:44vmax;height:44vmax;top:-16vmax;left:-12vmax;background:radial-gradient(circle,#4361ee,transparent 65%)}
    .orb.b{width:38vmax;height:38vmax;bottom:-14vmax;right:-10vmax;background:radial-gradient(circle,#7209b7,transparent 65%);animation-delay:-6s}
    .orb.c{width:30vmax;height:30vmax;top:40%;left:55%;background:radial-gradient(circle,#12b7f5,transparent 65%);opacity:.35;animation-delay:-11s}

    @keyframes float{
        from{transform:translate3d(0,0,0) scale(1)}
        to{transform:translate3d(4vmax,-3vmax,0) scale(1.12)}
    }

    /* ===== 外层容器：上下留白由 margin:auto 兜底，内容超高时不会被裁切 ===== */
    .container{
        width:100%;
        max-width:var(--maxw);
        margin-block:auto;
        margin-inline:auto;
        animation:rise .9s var(--ease) both;
    }

    @keyframes rise{
        from{opacity:0;transform:translateY(24px)}
        to{opacity:1;transform:translateY(0)}
    }

    /* ===== 头部 ===== */
    .hero{
        text-align:center;
        margin-bottom:var(--sec-gap);
    }

    .chip{
        display:inline-flex;
        align-items:center;
        gap:8px;
        padding:7px 15px;
        margin-bottom:18px;
        font-size:.76rem;
        font-weight:600;
        letter-spacing:.08em;
        color:#cfd9ff;
        background:var(--glass);
        border:1px solid var(--stroke);
        border-radius:999px;
        backdrop-filter:blur(10px);
    }
    .chip .dot{
        width:7px;height:7px;
        flex:0 0 auto;
        border-radius:50%;
        background:#3ddc97;
        box-shadow:0 0 0 0 rgba(61,220,151,.55);
        animation:pulse 2.2s ease-out infinite;
    }
    @keyframes pulse{
        0%{box-shadow:0 0 0 0 rgba(61,220,151,.55)}
        70%{box-shadow:0 0 0 9px rgba(61,220,151,0)}
        100%{box-shadow:0 0 0 0 rgba(61,220,151,0)}
    }

    h1{
        font-size:clamp(2.05rem,6.2vw,3.25rem);
        font-weight:800;
        line-height:1.15;
        letter-spacing:.015em;
        background:linear-gradient(180deg,#ffffff 12%,#a9baff 100%);
        -webkit-background-clip:text;
        background-clip:text;
        color:transparent;
        filter:drop-shadow(0 8px 30px rgba(67,97,238,.35));
    }

    .subtitle{
        margin-top:14px;
        font-size:clamp(.85rem,2.6vw,.93rem);
        line-height:1.7;
        color:var(--muted);
        letter-spacing:.06em;
    }

    /* ===== 公告卡片 ===== */
    .announcement{
        position:relative;
        margin-bottom:var(--sec-gap);
        padding:calc(var(--pad) - 2px) var(--pad) var(--pad) calc(var(--pad) + 6px);
        background:linear-gradient(180deg,var(--glass-2),var(--glass));
        border:1px solid var(--stroke);
        border-radius:var(--radius);
        backdrop-filter:blur(16px);
        box-shadow:0 18px 50px -20px rgba(0,0,0,.75),inset 0 1px 0 rgba(255,255,255,.06);
        overflow:hidden;
    }
    /* 左侧彩条 */
    .announcement::before{
        content:"";
        position:absolute;
        inset:0 auto 0 0;
        width:3px;
        background:linear-gradient(180deg,var(--accent),var(--brand),#7209b7);
    }
    /* 左上柔光 */
    .announcement::after{
        content:"";
        position:absolute;
        top:-60%;left:-10%;
        width:60%;height:220%;
        background:radial-gradient(closest-side,rgba(72,149,239,.16),transparent);
        pointer-events:none;
    }

    .ann-head{
        position:relative;
        display:flex;
        align-items:center;
        gap:10px;
        margin-bottom:14px;
    }
    .ann-head h2{
        display:flex;
        align-items:center;
        gap:10px;
        font-size:1rem;
        font-weight:700;
        letter-spacing:.04em;
        color:#dfe7ff;
    }
    .ann-head .ico{
        display:grid;
        place-items:center;
        width:28px;height:28px;
        flex:0 0 auto;
        border-radius:9px;
        font-size:.8rem;
        color:#fff;
        background:linear-gradient(135deg,var(--accent),var(--brand));
        box-shadow:0 6px 16px -6px rgba(72,149,239,.9);
    }
    /* 右侧标签：把标题行两端撑开，形成明确的栏位关系 */
    .ann-head .tag{
        margin-left:auto;
        padding:3px 10px;
        font-size:.68rem;
        font-weight:600;
        letter-spacing:.1em;
        color:#9db0e8;
        border:1px solid var(--stroke);
        border-radius:999px;
        background:rgba(255,255,255,.03);
        white-space:nowrap;
    }

    /* 首行为整段声明的主句，单列一行、加重 */
    .ann-lead{
        position:relative;
        margin-bottom:12px;
        padding-bottom:12px;
        font-size:.95rem;
        font-weight:600;
        letter-spacing:.04em;
        color:#e6ecff;
        border-bottom:1px dashed rgba(255,255,255,.09);
    }

    /* 条款逐条成行，悬挂缩进，左边缘对齐 */
    .ann-list{
        position:relative;
        list-style:none;
        display:grid;
        gap:9px;
    }
    .ann-list li{
        position:relative;
        padding-left:16px;
        font-size:clamp(.85rem,2.5vw,.9rem);
        line-height:1.85;
        color:#c3cee9;
        text-align:justify;
        text-wrap:pretty;
        word-break:break-word;
    }
    .ann-list li::before{
        content:"";
        position:absolute;
        left:1px;
        top:.78em;
        width:5px;height:5px;
        border-radius:1.5px;
        background:linear-gradient(135deg,var(--accent),var(--brand));
        opacity:.9;
    }

    /* ===== 按钮区 ===== */
    .links{
        display:grid;
        grid-template-columns:repeat(2,minmax(0,1fr));
        gap:var(--gap);
    }

    .btn{
        position:relative;
        display:flex;
        align-items:center;
        gap:13px;
        min-width:0;
        padding:15px 18px;
        border:none;
        border-radius:15px;
        font:inherit;
        font-size:.98rem;
        font-weight:600;
        letter-spacing:.02em;
        color:#fff;
        text-align:left;
        text-decoration:none;
        cursor:pointer;
        overflow:hidden;
        isolation:isolate;
        background:linear-gradient(135deg,var(--c1),var(--c2));
        box-shadow:0 12px 30px -14px var(--glow),inset 0 1px 0 rgba(255,255,255,.18);
        transition:transform .45s var(--ease),box-shadow .45s var(--ease),filter .45s var(--ease);
    }

    /* 划过的高光带 */
    .btn::before{
        content:"";
        position:absolute;
        inset:0;
        z-index:-1;
        background:linear-gradient(115deg,transparent 25%,rgba(255,255,255,.32) 48%,transparent 68%);
        transform:translateX(-130%);
        transition:transform .85s var(--ease);
    }

    /* 点击涟漪 */
    .btn .ripple{
        position:absolute;
        z-index:-1;
        width:10px;height:10px;
        margin:-5px 0 0 -5px;
        border-radius:50%;
        background:rgba(255,255,255,.5);
        transform:scale(0);
        opacity:.7;
        animation:ripple .62s ease-out forwards;
        pointer-events:none;
    }
    @keyframes ripple{
        to{transform:scale(38);opacity:0}
    }

    .btn:hover{
        transform:translateY(-3px);
        box-shadow:0 22px 44px -18px var(--glow),inset 0 1px 0 rgba(255,255,255,.26);
        filter:brightness(1.06);
    }
    .btn:hover::before{transform:translateX(130%)}
    .btn:active{transform:translateY(-1px) scale(.995)}
    .btn:focus-visible{outline:2px solid #fff;outline-offset:3px}

    /* 图标胶囊 */
    .btn .ico{
        flex:0 0 auto;
        display:grid;
        place-items:center;
        width:38px;height:38px;
        border-radius:11px;
        font-size:1rem;
        background:rgba(255,255,255,.18);
        box-shadow:inset 0 1px 0 rgba(255,255,255,.3);
        transition:transform .45s var(--ease),background .45s var(--ease);
    }
    .btn:hover .ico{
        transform:scale(1.06) rotate(-4deg);
        background:rgba(255,255,255,.26);
    }

    .btn .label{
        flex:1 1 auto;
        min-width:0;
        line-height:1.4;
        text-shadow:0 1px 2px rgba(0,0,0,.18);
        overflow-wrap:anywhere;
    }

    .btn .arrow{
        flex:0 0 auto;
        font-size:.8rem;
        opacity:.65;
        transform:translateX(0);
        transition:transform .45s var(--ease),opacity .45s var(--ease);
    }
    .btn:hover .arrow{transform:translateX(4px);opacity:1}

    /* 横跨两列：主入口与客服入口 */
    .btn.span-2{grid-column:1 / -1}

    /* 主入口：加高、放大，确立视觉第一层级 */
    .btn-primary{
        padding:18px 20px;
        border-radius:16px;
    }
    .btn-primary .ico{width:44px;height:44px;border-radius:13px;font-size:1.1rem}
    .btn-primary .label{font-size:1.06rem;font-weight:700;letter-spacing:.03em}

    /* 配色 */
    .btn-2{--c1:#4361ee;--c2:#3a0ca3;--glow:rgba(67,97,238,.55)}
    .btn-4{--c1:#2aabee;--c2:#00547f;--glow:rgba(42,171,238,.5)}
    .btn-6{--c1:#12b7f5;--c2:#0a6ea8;--glow:rgba(18,183,245,.5)}
    .btn-5{--c1:#2ec06b;--c2:#0f7a3d;--glow:rgba(46,192,107,.5)}

    /* ===== 页脚 ===== */
    .footer{
        margin-top:var(--sec-gap);
        padding-top:18px;
        border-top:1px solid var(--stroke);
        text-align:center;
        font-size:.78rem;
        line-height:1.9;
        color:#6f7d9e;
        letter-spacing:.04em;
    }
    .footer .sep{margin:0 8px;opacity:.55}

    /* ===== 弹窗 ===== */
    .modal-overlay{
        position:fixed;
        inset:0;
        z-index:9999;
        display:flex;
        align-items:center;
        justify-content:center;
        padding:clamp(16px,4vw,24px);
        background:rgba(4,7,16,.66);
        backdrop-filter:blur(10px);
        opacity:0;
        visibility:hidden;
        transition:opacity .32s var(--ease),visibility .32s var(--ease);
    }
    .modal-overlay.show{opacity:1;visibility:visible}

    .modal-box{
        width:100%;
        max-width:400px;
        background:linear-gradient(180deg,#141c31,#0d1424);
        border:1px solid var(--stroke-2);
        border-radius:22px;
        box-shadow:0 40px 90px -30px rgba(0,0,0,.95),inset 0 1px 0 rgba(255,255,255,.07);
        overflow:hidden;
        transform:translateY(24px) scale(.96);
        transition:transform .42s var(--ease);
    }
    .modal-overlay.show .modal-box{transform:translateY(0) scale(1)}

    .modal-header{
        position:relative;
        display:flex;
        align-items:center;
        justify-content:center;
        gap:10px;
        padding:17px 22px;
        font-size:1rem;
        font-weight:700;
        letter-spacing:.04em;
        color:#fff;
        background:linear-gradient(135deg,rgba(67,97,238,.95),rgba(58,12,163,.95));
        border-bottom:1px solid rgba(255,255,255,.12);
    }
    .modal-header::after{
        content:"";
        position:absolute;
        inset:auto 0 0 0;
        height:1px;
        background:linear-gradient(90deg,transparent,rgba(255,255,255,.5),transparent);
    }
    .modal-header .ico{
        display:grid;place-items:center;
        width:30px;height:30px;
        flex:0 0 auto;
        border-radius:9px;
        font-size:.85rem;
        background:rgba(255,255,255,.2);
    }

    .modal-body{
        padding:22px 22px 6px;
        font-size:.92rem;
        line-height:1.8;
        color:#cdd7f0;
        max-height:58vh;
        max-height:58dvh;
        overflow-y:auto;
        overscroll-behavior:contain;
    }
    .modal-body::-webkit-scrollbar{width:6px}
    .modal-body::-webkit-scrollbar-thumb{background:rgba(255,255,255,.16);border-radius:99px}

    /* 二维码：固定 232px 视觉宽度并居中，避免大屏时被拉满 */
    .qr{
        width:min(232px,72%);
        margin-inline:auto;
        background:#fff;
        border-radius:14px;
        padding:10px;
        line-height:0;
        box-shadow:0 14px 34px -18px rgba(0,0,0,.9);
    }
    .qr img{display:block;width:100%;height:auto;border-radius:8px}

    .qr-tip{
        margin-top:14px;
        margin-bottom:14px;
        text-align:center;
        font-size:.78rem;
        color:#8d9ab9;
        letter-spacing:.08em;
    }

    .modal-footer{padding:8px 22px 22px}

    .modal-btn{
        display:flex;
        align-items:center;
        justify-content:center;
        gap:9px;
        width:100%;
        padding:13px;
        border:none;
        border-radius:var(--radius-sm);
        font:inherit;
        font-size:.98rem;
        font-weight:600;
        letter-spacing:.04em;
        color:#fff;
        cursor:pointer;
        background:linear-gradient(135deg,var(--accent),var(--brand));
        box-shadow:0 14px 30px -14px rgba(67,97,238,.95),inset 0 1px 0 rgba(255,255,255,.22);
        transition:transform .3s var(--ease),box-shadow .3s var(--ease),filter .3s var(--ease);
    }
    .modal-btn:hover{transform:translateY(-2px);filter:brightness(1.07);box-shadow:0 20px 38px -16px rgba(67,97,238,1),inset 0 1px 0 rgba(255,255,255,.28)}
    .modal-btn:active{transform:translateY(0) scale(.995)}
    .modal-btn:focus-visible{outline:2px solid #fff;outline-offset:3px}

    /* 弹窗打开时锁滚动 */
    html.is-locked,html.is-locked body{overflow:hidden}

    /* ===== 响应式 ===== */
    /* 中屏：按钮仍是双列，但收紧内距，保证标签不挤 */
    @media (max-width:600px){
        .links{grid-template-columns:1fr}
        .btn{padding:14px 16px;font-size:.94rem;gap:11px}
        .btn .ico{width:36px;height:36px;font-size:.95rem}
        .btn-primary{padding:16px 16px}
        .btn-primary .ico{width:40px;height:40px}
        .btn-primary .label{font-size:1rem}
        .ann-head .tag{display:none}
    }

    @media (max-width:380px){
        .btn .arrow{display:none}
        .ann-list li{text-align:left}
    }

    @media (prefers-reduced-motion:reduce){
        *,*::before,*::after{
            animation-duration:.001ms!important;
            animation-iteration-count:1!important;
            transition-duration:.001ms!important;
        }
    }
</style>
</head>
<body>
    <!-- 背景光晕 -->
    <div class="bg" aria-hidden="true">
        <span class="orb a"></span>

        <section class="announcement" aria-labelledby="noticeTitle">

        <nav class="links" aria-label="快捷入口">

                <i class="fas fa-arrow-right arrow" aria-hidden="true"></i>
            </a>

                <span class="ico"><i class="fab fa-qq"></i></span>
                <span class="label">QQ 群</span>
                <i class="fas fa-arrow-right arrow" aria-hidden="true"></i>
            </a>

            <!-- 点击打开微信客服弹窗，页面加载不自动弹出 -->
            <button class="btn btn-5 span-2" id="openNoticeBtn" type="button">

            <span>阿飞官网</span><span class="sep">·</span><span>仅供学习研究，24 小时内删除</span>

    <!-- ===== 微信客服弹窗（默认关闭） ===== -->
    <div class="modal-overlay" id="noticeModal" role="dialog" aria-modal="true" aria-label="内部购买（微信）">
        <div class="modal-box">
            <div class="modal-header">
                <span class="ico"><i class="fab fa-weixin"></i></span>
                <span>内部购买（微信）</span>
            </div>
            <div class="modal-body" id="noticeContent">

                    <img src="https://pan.29o.cn/view.php/82d380debe97c373f90b26da6239ee86.png" alt="微信客服二维码" loading="lazy">

                    <i class="fas fa-check-circle" aria-hidden="true"></i><span>知道了</span>
                </button>
            </div>
        </div>
    </div>

    <script>
        (function () {
            var modal = document.getElementById('noticeModal');
            var openBtn = document.getElementById('openNoticeBtn');
            var closeBtn = document.getElementById('noticeBtn');
            var lastFocus = null;
            var reduceMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;

            function openModal() {
                lastFocus = document.activeElement;
                modal.classList.add('show');
                document.documentElement.classList.add('is-locked');
                closeBtn.focus();
            }
            function closeModal() {
                modal.classList.remove('show');
                document.documentElement.classList.remove('is-locked');
                if (lastFocus && typeof lastFocus.focus === 'function') lastFocus.focus();
            }

            openBtn.addEventListener('click', openModal);
            closeBtn.addEventListener('click', closeModal);

            // 点击遮罩空白处关闭
            modal.addEventListener('click', function (e) {
                if (e.target === modal) closeModal();
            });

            // Esc 关闭
            document.addEventListener('keydown', function (e) {
                if (e.key === 'Escape' && modal.classList.contains('show')) closeModal();
            });

            // 按钮点击涟漪
            Array.prototype.forEach.call(document.querySelectorAll('.btn'), function (btn) {
                btn.addEventListener('click', function (e) {
                    if (reduceMotion) return;
                    var r = btn.getBoundingClientRect();
                    var x = (e.clientX || r.left + r.width / 2) - r.left;
                    var y = (e.clientY || r.top + r.height / 2) - r.top;
                    var s = document.createElement('span');
                    s.className = 'ripple';
                    s.style.left = x + 'px';
                    s.style.top = y + 'px';
                    btn.appendChild(s);
                    setTimeout(function () { s.remove(); }, 640);
                });
            });
        })();
    </script>
</body>
</html>
