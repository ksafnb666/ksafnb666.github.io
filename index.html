<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#070b18">
<title>阿飞官网</title>
<link rel="preconnect" href="https://cdnjs.cloudflare.com">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
    :root{
        --bg:#070b18;
        --ink:#eef3ff;
        --muted:#93a1c4;
        --stroke:rgba(255,255,255,.10);
        --stroke-2:rgba(255,255,255,.16);
        --glass:rgba(255,255,255,.045);
        --glass-2:rgba(255,255,255,.07);
        --brand:#4361ee;
        --brand-2:#3a0ca3;
        --accent:#4895ef;
        --radius:18px;
        --ease:cubic-bezier(.16,1,.3,1);
    }

    *{margin:0;padding:0;box-sizing:border-box}
    html{-webkit-text-size-adjust:100%}

    body{
        position:relative;
        min-height:100vh;
        display:flex;
        align-items:center;
        justify-content:center;
        padding:clamp(18px,4vw,56px) clamp(14px,3vw,28px);
        color:var(--ink);
        background:var(--bg);
        font-family:'Inter','PingFang SC','Microsoft YaHei',system-ui,sans-serif;
        -webkit-font-smoothing:antialiased;
        -webkit-tap-highlight-color:transparent;
        overflow-x:hidden;
    }

    /* ===== 背景光晕 ===== */
    .bg{
        position:fixed;
        inset:0;
        z-index:-2;
        overflow:hidden;
        pointer-events:none;
    }
    .bg::after{
        content:"";
        position:absolute;
        inset:0;
        background:
            radial-gradient(1200px 600px at 50% -10%,rgba(67,97,238,.22),transparent 70%),
            radial-gradient(900px 500px at 100% 100%,rgba(58,12,163,.25),transparent 70%);
    }
    .orb{
        position:absolute;
        border-radius:50%;
        filter:blur(70px);
        opacity:.55;
        animation:float 18s var(--ease) infinite alternate;
    }
    .orb.a{width:44vmax;height:44vmax;top:-16vmax;left:-12vmax;background:radial-gradient(circle,#4361ee,transparent 65%)}
    .orb.b{width:38vmax;height:38vmax;bottom:-14vmax;right:-10vmax;background:radial-gradient(circle,#7209b7,transparent 65%);animation-delay:-6s}
    .orb.c{width:30vmax;height:30vmax;top:40%;left:55%;background:radial-gradient(circle,#12b7f5,transparent 65%);opacity:.35;animation-delay:-11s}

    @keyframes float{
        from{transform:translate3d(0,0,0) scale(1)}
        to{transform:translate3d(4vmax,-3vmax,0) scale(1.12)}
    }

    /* ===== 布局 ===== */
    .container{
        width:100%;
        max-width:840px;
        animation:rise .9s var(--ease) both;
    }

    @keyframes rise{
        from{opacity:0;transform:translateY(26px)}
        to{opacity:1;transform:translateY(0)}
    }

    /* ===== 头部 ===== */
    .hero{text-align:center;margin-bottom:clamp(20px,3vw,30px)}

    .chip{
        display:inline-flex;
        align-items:center;
        gap:8px;
        padding:7px 15px;
        margin-bottom:16px;
        font-size:.78rem;
        font-weight:600;
        letter-spacing:.06em;
        color:#cfd9ff;
        background:var(--glass);
        border:1px solid var(--stroke);
        border-radius:999px;
        backdrop-filter:blur(10px);
    }
    .chip .dot{
        width:7px;height:7px;border-radius:50%;
        background:#3ddc97;
        box-shadow:0 0 0 0 rgba(61,220,151,.55);
        animation:pulse 2.2s ease-out infinite;
    }
    @keyframes pulse{
        0%{box-shadow:0 0 0 0 rgba(61,220,151,.55)}
        70%{box-shadow:0 0 0 9px rgba(61,220,151,0)}
        100%{box-shadow:0 0 0 0 rgba(61,220,151,0)}
    }

    h1{
        font-size:clamp(2.05rem,6vw,3.3rem);
        font-weight:800;
        line-height:1.12;
        letter-spacing:-.02em;
        background:linear-gradient(180deg,#ffffff 12%,#a9baff 100%);
        -webkit-background-clip:text;
        background-clip:text;
        color:transparent;
        filter:drop-shadow(0 8px 30px rgba(67,97,238,.35));
    }

    .subtitle{
        margin-top:12px;
        font-size:.92rem;
        color:var(--muted);
        letter-spacing:.02em;
    }

    /* ===== 公告卡片 ===== */
    .announcement{
        position:relative;
        margin-bottom:clamp(18px,3vw,26px);
        padding:clamp(16px,2.4vw,22px) clamp(16px,2.4vw,22px) clamp(16px,2.4vw,22px) clamp(20px,3vw,26px);
        background:linear-gradient(180deg,var(--glass-2),var(--glass));
        border:1px solid var(--stroke);
        border-radius:var(--radius);
        backdrop-filter:blur(16px);
        box-shadow:0 18px 50px -20px rgba(0,0,0,.75),inset 0 1px 0 rgba(255,255,255,.06);
        overflow:hidden;
    }
    .announcement::before{
        content:"";
        position:absolute;
        inset:0 auto 0 0;
        width:3px;
        background:linear-gradient(180deg,var(--accent),var(--brand),#7209b7);
    }
    .announcement::after{
        content:"";
        position:absolute;
        top:-60%;left:-10%;
        width:60%;height:220%;
        background:radial-gradient(closest-side,rgba(72,149,239,.16),transparent);
        pointer-events:none;
    }

    .announcement h2{
        display:flex;
        align-items:center;
        gap:10px;
        margin-bottom:12px;
        font-size:1.02rem;
        font-weight:700;
        letter-spacing:.02em;
        color:#dfe7ff;
    }
    .announcement h2 .ico{
        display:grid;
        place-items:center;
        width:28px;height:28px;
        border-radius:9px;
        font-size:.82rem;
        color:#fff;
        background:linear-gradient(135deg,var(--accent),var(--brand));
        box-shadow:0 6px 16px -6px rgba(72,149,239,.9);
    }

    .announcement p{
        position:relative;
        font-size:.9rem;
        line-height:1.95;
        color:#c3cee9;
        white-space:pre-line;
        text-align:left;
    }

    /* ===== 按钮区 ===== */
    .button-grid{
        display:grid;
        grid-template-columns:repeat(2,minmax(0,1fr));
        gap:14px;
    }

    .btn{
        position:relative;
        display:flex;
        align-items:center;
        gap:13px;
        min-width:0;
        padding:16px 20px;
        border:none;
        border-radius:15px;
        font:inherit;
        font-size:1rem;
        font-weight:600;
        letter-spacing:.01em;
        color:#fff;
        text-align:left;
        text-decoration:none;
        cursor:pointer;
        overflow:hidden;
        isolation:isolate;
        background:linear-gradient(135deg,var(--c1),var(--c2));
        box-shadow:0 12px 30px -14px var(--glow),inset 0 1px 0 rgba(255,255,255,.18);
        transition:transform .45s var(--ease),box-shadow .45s var(--ease),filter .45s var(--ease);
    }

    /* 划过的高光带 */
    .btn::before{
        content:"";
        position:absolute;
        inset:0;
        z-index:-1;
        background:linear-gradient(115deg,transparent 25%,rgba(255,255,255,.32) 48%,transparent 68%);
        transform:translateX(-130%);
        transition:transform .85s var(--ease);
    }

    /* 点击涟漪 */
    .btn .ripple{
        position:absolute;
        z-index:-1;
        width:10px;height:10px;
        margin:-5px 0 0 -5px;
        border-radius:50%;
        background:rgba(255,255,255,.5);
        transform:scale(0);
        opacity:.7;
        animation:ripple .62s ease-out forwards;
        pointer-events:none;
    }
    @keyframes ripple{
        to{transform:scale(38);opacity:0}
    }

    .btn:hover{
        transform:translateY(-4px);
        box-shadow:0 22px 44px -18px var(--glow),inset 0 1px 0 rgba(255,255,255,.26);
        filter:brightness(1.06);
    }
    .btn:hover::before{transform:translateX(130%)}
    .btn:active{transform:translateY(-1px) scale(.995)}
    .btn:focus-visible{outline:2px solid #fff;outline-offset:3px}

    /* 图标胶囊 */
    .btn .ico{
        flex:0 0 auto;
        display:grid;
        place-items:center;
        width:38px;height:38px;
        border-radius:11px;
        font-size:1.02rem;
        background:rgba(255,255,255,.18);
        box-shadow:inset 0 1px 0 rgba(255,255,255,.3);
        transition:transform .45s var(--ease),background .45s var(--ease);
    }
    .btn:hover .ico{
        transform:scale(1.06) rotate(-4deg);
        background:rgba(255,255,255,.26);
    }

    .btn .label{
        flex:1 1 auto;
        min-width:0;
        line-height:1.35;
        text-shadow:0 1px 2px rgba(0,0,0,.18);
    }

    .btn .arrow{
        flex:0 0 auto;
        font-size:.82rem;
        opacity:.65;
        transform:translateX(0);
        transition:transform .45s var(--ease),opacity .45s var(--ease);
    }
    .btn:hover .arrow{transform:translateX(4px);opacity:1}

    /* 配色 */
    .btn-2{--c1:#4361ee;--c2:#3a0ca3;--glow:rgba(67,97,238,.55)}
    .btn-2.alt{--c1:#4a3ff0;--c2:#7209b7;--glow:rgba(114,9,183,.5)}
    .btn-4{--c1:#2aabee;--c2:#00547f;--glow:rgba(42,171,238,.5)}
    .btn-6{--c1:#12b7f5;--c2:#0a6ea8;--glow:rgba(18,183,245,.5)}
    .btn-5{--c1:#2ec06b;--c2:#0f7a3d;--glow:rgba(46,192,107,.5)}

    .btn.full{grid-column:span 2}

    /* ===== 页脚 ===== */
    .footer{
        margin-top:clamp(22px,3vw,30px);
        padding-top:18px;
        border-top:1px solid var(--stroke);
        text-align:center;
        font-size:.8rem;
        line-height:1.9;
        color:#6f7d9e;
        letter-spacing:.02em;
    }
    .footer .sep{margin:0 8px;opacity:.55}

    /* ===== 弹窗 ===== */
    .modal-overlay{
        position:fixed;
        inset:0;
        z-index:9999;
        display:flex;
        align-items:center;
        justify-content:center;
        padding:20px;
        background:rgba(4,7,16,.66);
        backdrop-filter:blur(10px);
        opacity:0;
        visibility:hidden;
        transition:opacity .32s var(--ease),visibility .32s var(--ease);
    }
    .modal-overlay.show{opacity:1;visibility:visible}

    .modal-box{
        width:100%;
        max-width:440px;
        background:linear-gradient(180deg,#141c31,#0d1424);
        border:1px solid var(--stroke-2);
        border-radius:22px;
        box-shadow:0 40px 90px -30px rgba(0,0,0,.95),inset 0 1px 0 rgba(255,255,255,.07);
        overflow:hidden;
        transform:translateY(24px) scale(.96);
        transition:transform .42s var(--ease);
    }
    .modal-overlay.show .modal-box{transform:translateY(0) scale(1)}

    .modal-header{
        position:relative;
        display:flex;
        align-items:center;
        justify-content:center;
        gap:10px;
        padding:18px 22px;
        font-size:1.05rem;
        font-weight:700;
        letter-spacing:.02em;
        color:#fff;
        background:linear-gradient(135deg,rgba(67,97,238,.95),rgba(58,12,163,.95));
        border-bottom:1px solid rgba(255,255,255,.12);
    }
    .modal-header::after{
        content:"";
        position:absolute;
        inset:auto 0 0 0;
        height:1px;
        background:linear-gradient(90deg,transparent,rgba(255,255,255,.5),transparent);
    }
    .modal-header .ico{
        display:grid;place-items:center;
        width:30px;height:30px;border-radius:9px;
        font-size:.85rem;
        background:rgba(255,255,255,.2);
    }

    .modal-body{
        padding:20px 22px 8px;
        font-size:.94rem;
        line-height:1.8;
        color:#cdd7f0;
        max-height:58vh;
        overflow-y:auto;
        white-space:pre-line;
    }
    .modal-body::-webkit-scrollbar{width:6px}
    .modal-body::-webkit-scrollbar-thumb{background:rgba(255,255,255,.16);border-radius:99px}

    .qr{
        background:#fff;
        border-radius:14px;
        padding:10px;
        line-height:0;
        box-shadow:0 14px 34px -18px rgba(0,0,0,.9);
    }
    .qr img{display:block;width:100%;height:auto;border-radius:8px}

    .qr-tip{
        margin-top:12px;
        text-align:center;
        font-size:.8rem;
        color:#8d9ab9;
        letter-spacing:.02em;
    }

    .modal-footer{padding:16px 22px 22px}

    .modal-btn{
        display:flex;
        align-items:center;
        justify-content:center;
        gap:9px;
        width:100%;
        padding:13px;
        border:none;
        border-radius:12px;
        font:inherit;
        font-size:1rem;
        font-weight:600;
        color:#fff;
        cursor:pointer;
        background:linear-gradient(135deg,var(--accent),var(--brand));
        box-shadow:0 14px 30px -14px rgba(67,97,238,.95),inset 0 1px 0 rgba(255,255,255,.22);
        transition:transform .3s var(--ease),box-shadow .3s var(--ease),filter .3s var(--ease);
    }
    .modal-btn:hover{transform:translateY(-2px);filter:brightness(1.07);box-shadow:0 20px 38px -16px rgba(67,97,238,1),inset 0 1px 0 rgba(255,255,255,.28)}
    .modal-btn:active{transform:translateY(0) scale(.995)}

    /* ===== 响应式 ===== */
    @media (max-width:760px){
        .button-grid{grid-template-columns:1fr;gap:12px}
        .btn.full,.btn-2,.btn-4,.btn-6,.btn-5{grid-column:span 1}
        .btn{padding:14px 16px;font-size:.95rem;gap:11px}
        .btn .ico{width:34px;height:34px;font-size:.95rem}
        .announcement p{font-size:.86rem;line-height:1.9}
    }

    @media (prefers-reduced-motion:reduce){
        *,*::before,*::after{
            animation-duration:.001ms!important;
            animation-iteration-count:1!important;
            transition-duration:.001ms!important;
        }
    }
</style>
</head>
<body>
    <!-- 背景光晕 -->
    <div class="bg" aria-hidden="true">
        <span class="orb a"></span>
        <span class="orb b"></span>
        <span class="orb c"></span>
    </div>

    <div class="container">
        <header class="hero">
            <div class="chip"><span class="dot"></span>官方入口 · 实时更新</div>
            <h1>阿飞官网</h1>
            <p class="subtitle">发卡 · 提卡 · 社群 · 客服，一站直达</p>
        </header>

        <section class="announcement">
            <h2><span class="ico"><i class="fas fa-bullhorn"></i></span>最新公告</h2>
            <p>☆阿飞全项目公告声明☆
本系列作品仅供学习研究，使用者的任何行为与应用阿飞无关，请在24小时内删除本应用[下载代表同意本协议]
若有侵权违法行为，请联系我方删除内容
本卡网均为自愿捐赠
不支持米八 下单默认同意
有事联系阿飞   恶意投诉拉黑删卡处理</p>
        </section>

        <nav class="button-grid">
            <a href="https://shop.bromk.cn/shop/AFF" class="btn btn-2" target="_blank" rel="noopener noreferrer">
                <span class="ico"><i class="fas fa-credit-card"></i></span>
                <span class="label">24小时发卡网①</span>
                <i class="fas fa-arrow-right arrow"></i>
            </a>

            <a href="https://luoye.yjsfk.cn/shop/AFF" class="btn btn-2 alt" target="_blank" rel="noopener noreferrer">
                <span class="ico"><i class="fas fa-credit-card"></i></span>
                <span class="label">T1内部/三角洲私服提卡地址</span>
                <i class="fas fa-arrow-right arrow"></i>
            </a>

            <a href="https://t.me/KSAFNB" class="btn btn-4 full" target="_blank" rel="noopener noreferrer">
                <span class="ico"><i class="fab fa-telegram"></i></span>
                <span class="label">加入TG群 @KSAFNB</span>
                <i class="fas fa-arrow-right arrow"></i>
            </a>

            <a href="https://qm.qq.com/q/zyEUiopSko" class="btn btn-6 full" target="_blank" rel="noopener noreferrer">
                <span class="ico"><i class="fab fa-qq"></i></span>
                <span class="label">加入QQ群</span>
                <i class="fas fa-arrow-right arrow"></i>
            </a>

            <!-- 点击打开微信客服弹窗，页面加载不自动弹出 -->
            <button class="btn btn-5 full" id="openNoticeBtn" type="button">
                <span class="ico"><i class="fab fa-weixin"></i></span>
                <span class="label">微信客服</span>
                <i class="fas fa-arrow-right arrow"></i>
            </button>
        </nav>

        <footer class="footer">
            <span>阿飞官网</span><span class="sep">·</span><span>仅供学习研究，24小时内删除</span>
        </footer>
    </div>

    <!-- ===== 微信客服弹窗（默认关闭） ===== -->
    <div class="modal-overlay" id="noticeModal" role="dialog" aria-modal="true" aria-label="内部购买（微信）">
        <div class="modal-box">
            <div class="modal-header">
                <span class="ico"><i class="fab fa-weixin"></i></span>
                <span>内部购买（微信）</span>
            </div>
            <div class="modal-body" id="noticeContent">
                <div class="qr">
                    <img src="https://pan.29o.cn/view.php/82d380debe97c373f90b26da6239ee86.png" alt="微信客服二维码" loading="lazy">
                </div>
                <p class="qr-tip">微信扫一扫 · 添加客服</p>
            </div>
            <div class="modal-footer">
                <button class="modal-btn" id="noticeBtn" type="button">
                    <i class="fas fa-check-circle"></i><span>知道了</span>
                </button>
            </div>
        </div>
    </div>

    <script>
        (function () {
            var modal = document.getElementById('noticeModal');
            var openBtn = document.getElementById('openNoticeBtn');
            var closeBtn = document.getElementById('noticeBtn');

            function openModal() {
                modal.classList.add('show');
                document.body.style.overflow = 'hidden';
            }
            function closeModal() {
                modal.classList.remove('show');
                document.body.style.overflow = '';
            }

            // 打开弹窗
            openBtn.addEventListener('click', openModal);
            // “知道了”关闭
            closeBtn.addEventListener('click', closeModal);
            // 点击遮罩空白处关闭
            modal.addEventListener('click', function (e) {
                if (e.target === modal) closeModal();
            });
            // Esc 关闭
            document.addEventListener('keydown', function (e) {
                if (e.key === 'Escape' && modal.classList.contains('show')) closeModal();
            });

            // 按钮点击涟漪
            Array.prototype.forEach.call(document.querySelectorAll('.btn'), function (btn) {
                btn.addEventListener('click', function (e) {
                    var r = btn.getBoundingClientRect();
                    var x = (e.clientX || r.left + r.width / 2) - r.left;
                    var y = (e.clientY || r.top + r.height / 2) - r.top;
                    var s = document.createElement('span');
                    s.className = 'ripple';
                    s.style.left = x + 'px';
                    s.style.top = y + 'px';
                    btn.appendChild(s);
                    setTimeout(function () { s.remove(); }, 640);
                });
            });
        })();
    </script>
</body>
</html>
